# Add this to your Home Assistant configuration.yaml
# Place the custom_components/opcom_pzu/ folder in your HA config directory first.

sensor:
  - platform: opcom_pzu

# This creates three sensors automatically:
#   sensor.opcom_pzu_pt15   — current 15-minute interval price (RON/MWh)
#   sensor.opcom_pzu_pt30   — current 30-minute interval price (RON/MWh)
#   sensor.opcom_pzu_pt60   — current 60-minute interval price (RON/MWh)
#
# Each sensor also exposes these attributes:
#   all_prices            — list of all prices for the day
#   min_price_ron_mwh     — daily minimum
#   max_price_ron_mwh     — daily maximum
#   avg_price_ron_mwh     — daily average
#   current_interval_index — index of the current interval (0-based)
